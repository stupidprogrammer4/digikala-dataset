[properties.abstentions]
type = "object"

[properties.abstentions.additionalProperties]
"$ref" = "#/$defs/Abstention"

[properties.abstentions.propertyNames]
enum = [
    "taxonomy",
    "audience",
    "styles",
    "motifs",
    "use_cases",
    "design_details",
]

[properties.vocabulary_gaps]
type = "array"

[properties.vocabulary_gaps.items]
