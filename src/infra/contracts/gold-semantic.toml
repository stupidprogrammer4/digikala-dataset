    "value",
]
type = "object"

["$defs".AudiencePrediction.properties.confidence]
maximum = 1
minimum = 0
type = "number"

["$defs".AudiencePrediction.properties.evidence]
minItems = 1
type = "array"
uniqueItems = true

["$defs".AudiencePrediction.properties.evidence.items]
minLength = 1
pattern = "\\S"
type = "string"

["$defs".AudiencePrediction.properties.value]
enum = [
    "women",
    "men",
    "unisex",
]
type = "string"

["$defs".DesignDetailPrediction]
