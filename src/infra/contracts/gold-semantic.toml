additionalProperties = false
required = [
    "schema_version",
    "taxonomy",
    "features",
    "abstentions",
]
type = "object"

["$defs".Abstention]
additionalProperties = false
required = [
    "reason",
    "explanation",
]
type = "object"

["$defs".Abstention.properties.reason]
enum = [
    "not_stated",
    "ambiguous",
    "not_applicable",
    "out_of_vocabulary",
]
type = "string"

["$defs".Abstention.properties.explanation]
minLength = 1
pattern = "\\S"
type = "string"

["$defs".Abstention.properties.evidence]
type = "array"
uniqueItems = true

["$defs".Abstention.properties.evidence.items]
minLength = 1
pattern = "\\S"
type = "string"

["$defs".AudiencePrediction]
additionalProperties = false
required = [
    "confidence",
