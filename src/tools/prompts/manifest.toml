    "Historical aliases are preserved as provenance; no implicit alias-table injection or blind legacy normalization is required by the API prompts.",
]
context_policy = "Send shared policy plus exactly one task prompt. Do not attach history, examples, schemas or unused dataset fields."
examples = "tests/fixtures/prompt_examples.py (not part of runtime prompts)"

