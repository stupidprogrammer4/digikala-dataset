    "record_id",
    "source",
]
output_fields = [
    "record_id",
    "label",
]
historical_sources = "history/manifest.toml"
limitations = [
    "No live API model run has been performed for these prompts.",
    "Prompt text alone does not guarantee JSON compliance, evidence support or resistance to prompt injection.",
