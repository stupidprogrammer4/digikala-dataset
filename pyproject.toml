[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "digikala-gold-products-fa"
version = "0.1.0"
description = "Build and maintain a Persian dataset of Digikala gold products with evidence-backed AI annotations"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<0.29",
  "huggingface-hub>=0.36,<1",
  "datasets==4.0.0",
  "networkx==3.6.1",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
labeling = ["litellm>=1.75,<2"]

[project.scripts]
digikala-gold-products-fa = "presentation.cli:main"
digikala-dataset = "presentation.cli:main"

[project.urls]
Repository = "https://github.com/stupidprogrammer4/digikala-dataset"
Issues = "https://github.com/stupidprogrammer4/digikala-dataset/issues"
Dataset = "https://huggingface.co/datasets/amupouya/digikala-gold-products-fa"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tools.prompts" = ["*.md", "*.toml", "history/*.md", "history/*.toml", "history/*.json"]
infra = ["contracts/*.json"]
